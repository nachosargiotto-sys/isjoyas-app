<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:ital,opsz,wght@0,6..96,500..700;1,6..96,500&family=Instrument+Sans:wght@400..700&display=swap">
<style>/* Layout: app de una columna pensada para el celular (máx. 560px), barra de pestañas fija abajo con botón central de carga. */
:root {
  --bg: #f1f2ee;          /* piedra fría */
  --surface: #ffffff;
  --surface-2: #e7e9e3;
  --ink: #1b2120;
  --muted: #5b6562;
  --line: #d6dad3;
  --gold: #8f6413;        /* oro legible sobre claro */
  --gold-soft: #f1e5c8;
  --silver: #5f6d73;
  --silver-soft: #e3e8ea;
  --good: #2c7a4b;
  --bad: #b13f2c;
  --scrim: rgba(20, 24, 23, 0.42);
  --shadow: 0 1px 2px rgba(27, 33, 32, 0.06), 0 8px 24px rgba(27, 33, 32, 0.06);
  --display: 'Bodoni Moda', 'Didot', 'Bodoni 72', Georgia, serif;
  --body: 'Instrument Sans', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
  --r: 14px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1312; --surface: #171c1b; --surface-2: #222827; --ink: #e9ece7; --muted: #9aa49f; --line: #2c3331;
    --gold: #d8ad57; --gold-soft: #3a3020; --silver: #aab7bc; --silver-soft: #263033; --good: #62bd88; --bad: #e57a62;
    --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1312; --surface: #171c1b; --surface-2: #222827; --ink: #e9ece7; --muted: #9aa49f; --line: #2c3331;
  --gold: #d8ad57; --gold-soft: #3a3020; --silver: #aab7bc; --silver-soft: #263033; --good: #62bd88; --bad: #e57a62;
  --scrim: rgba(0, 0, 0, 0.6); --shadow: 0 1px 2px rgba(0, 0, 0, 0.3); color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--ink); font: 15px/1.45 var(--body); -webkit-font-smoothing: antialiased; }
body.locked { overflow: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
h1, h2, h3 { margin: 0; text-wrap: balance; }
.boot { padding: 40px 16px; color: var(--muted); }

.app { max-width: 560px; margin: 0 auto; min-height: 100%; padding-bottom: calc(84px + env(safe-area-inset-bottom, 0px)); }
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; display: flex; align-items: center; justify-content: space-between;
  padding: 12px 16px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(10px); }
.brand { display: flex; align-items: baseline; gap: 6px; }
.brand .mark { font-family: var(--display); font-weight: 700; font-size: 24px; letter-spacing: 0.02em; color: var(--gold); }
.brand .word { font-family: var(--display); font-size: 20px; font-style: italic; }
.mode { font-size: 11px; text-transform: uppercase; letter-spacing: 0.12em; padding: 3px 8px; border-radius: 99px; border: 1px solid var(--line); color: var(--muted); }

.main { padding-inline: 16px; }
.screen { display: flex; flex-direction: column; gap: 14px; padding-block: 4px 16px; }
.pagetitle, .subhead h1 { font-family: var(--display); font-size: 28px; font-weight: 600; }
.subhead { display: flex; align-items: center; gap: 6px; margin-left: -8px; }

.monthnav { display: flex; align-items: center; justify-content: space-between; }
.monthnav h1 { font-family: var(--display); font-weight: 600; font-size: 26px; }
.iconbtn { background: none; border: 0; width: 40px; height: 40px; display: grid; place-items: center; border-radius: 99px; color: var(--ink); }
.iconbtn:hover { background: var(--surface-2); }

.lbl { font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 600; }
.sub, small { color: var(--muted); }
.muted { color: var(--muted); }
.hint { font-size: 12.5px; color: var(--muted); margin: 0; }
.hint.pad { padding-inline: 4px; }
.empty { color: var(--muted); padding: 8px 2px; margin: 0; }

.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 14px; }
.card.flush { padding: 0; overflow: hidden; }
.card-h { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; margin-bottom: 10px; }
.card-h h2 { font-size: 15px; font-weight: 650; }

/* Resultado del mes */
.hero { padding: 18px 16px 14px; border-radius: var(--r); background: var(--surface); border: 1px solid var(--line); box-shadow: var(--shadow);
  background-image: linear-gradient(135deg, var(--gold-soft), transparent 55%); }
.hero-top { display: flex; justify-content: space-between; align-items: center; }
.figure { font-family: var(--display); font-weight: 600; font-size: clamp(36px, 11vw, 50px); line-height: 1.1; margin: 6px 0 12px; font-variant-numeric: lining-nums tabular-nums; }
.figure.neg { color: var(--bad); }
.eq { margin: 0; display: grid; gap: 6px; }
.eq div { display: flex; justify-content: space-between; border-top: 1px dashed var(--line); padding-top: 6px; }
.eq dt { color: var(--muted); }
.eq dd { margin: 0; font-variant-numeric: tabular-nums; font-weight: 600; }
.pill { font-size: 11.5px; font-weight: 650; padding: 3px 9px; border-radius: 99px; }
.pill.open { background: var(--gold); color: var(--surface); }
.pill.closed { background: var(--surface-2); color: var(--muted); }

.people { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.person h3 { font-size: 13px; font-weight: 700; margin-bottom: 4px; }
.person dl { margin: 0; display: grid; gap: 3px; }
.person dl div { display: flex; justify-content: space-between; gap: 6px; font-size: 13px; }
.person dt { color: var(--muted); }
.person dd { margin: 0; font-variant-numeric: tabular-nums; }
.settle { margin-top: 12px; padding: 10px 12px; border-radius: 10px; background: var(--surface-2); }
.settle p { margin: 0; font-size: 14px; }
.settle .amt { font-weight: 700; font-variant-numeric: tabular-nums; color: var(--gold); }

.bars { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.bars li { display: grid; grid-template-columns: 96px 1fr auto; gap: 10px; align-items: center; font-size: 13px; }
.bt { height: 8px; background: var(--surface-2); border-radius: 99px; overflow: hidden; }
.bf { display: block; height: 100%; background: var(--silver); border-radius: 99px; }
.bv { font-variant-numeric: tabular-nums; min-width: 84px; text-align: right; }

.facts { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; font-size: 13px; }
.facts li { display: flex; justify-content: space-between; gap: 12px; }
.facts li span { color: var(--muted); }
.facts li b { text-align: right; font-variant-numeric: tabular-nums; font-weight: 600; }

/* Listas */
.list { list-style: none; margin: 0; padding: 0; }
.list li + li { border-top: 1px solid var(--line); }
.row, .list li.static { width: 100%; display: grid; grid-template-columns: 44px minmax(0, 1fr) auto; gap: 10px; align-items: center;
  padding: 11px 12px; background: none; border: 0; text-align: left; }
.card:not(.flush) .row, .card:not(.flush) .list li.static { padding-inline: 0; }
.row:hover { background: var(--surface-2); }
.date { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
.main-col { display: flex; flex-direction: column; min-width: 0; }
.main-col b, .main-col small { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.main-col b { font-weight: 600; }
.right { display: flex; flex-direction: column; align-items: flex-end; text-align: right; font-variant-numeric: tabular-nums; }
.tags { display: flex; gap: 6px; align-items: center; }
.tag { font-size: 11px; padding: 1px 7px; border-radius: 99px; font-weight: 600; white-space: nowrap; }
.tag.silver { background: var(--silver-soft); color: var(--silver); }
.tag.gold { background: var(--gold-soft); color: var(--gold); }
.tag.mix { background: linear-gradient(90deg, var(--silver-soft) 50%, var(--gold-soft) 50%); color: var(--ink); }
.tag.ghost { border: 1px dashed var(--line); color: var(--muted); }

.toolbar { display: flex; align-items: center; gap: 10px; }
.search { flex: 1; min-width: 0; width: 100%; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.total { font-size: 13px; color: var(--muted); white-space: nowrap; font-variant-numeric: tabular-nums; }
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.duo > div { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px; display: flex; flex-direction: column; }
.duo b { font-variant-numeric: tabular-nums; font-size: 17px; }

.chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.chips.scroll { flex-wrap: nowrap; overflow-x: auto; padding-bottom: 2px; scrollbar-width: none; }
.chip { border: 1px solid var(--line); background: var(--surface); padding: 6px 11px; border-radius: 99px; font-size: 13px; white-space: nowrap; }
.chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.chips .numwrap { width: 96px; }
.chipbtn { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); background: var(--surface); padding: 6px 10px; border-radius: 99px; font-size: 13px; align-self: flex-start; }
.chipbtn:disabled { opacity: 0.6; }

.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border-radius: 12px; padding: 11px 16px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.block { width: 100%; }
.btn.ghost { background: none; }
.btn.danger { background: var(--bad); border-color: var(--bad); color: #fff; }
.btn.ghost.danger { background: none; color: var(--bad); border-color: var(--line); }
.txtbtn { background: none; border: 0; color: var(--gold); font-weight: 600; padding: 6px 4px; }
.txtbtn.strong { font-weight: 700; }
.txtbtn:disabled { color: var(--muted); opacity: 0.6; cursor: default; }
.confirm { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; padding: 10px; border-radius: 12px; background: var(--surface-2); font-size: 14px; }
.confirm span { flex: 1 1 180px; }

/* Barra inferior */
.tabs { position: fixed; left: 0; right: 0; bottom: 0; z-index: 6; display: grid; grid-template-columns: repeat(5, 1fr); align-items: center;
  max-width: 560px; margin: 0 auto; padding: 6px 8px calc(6px + env(safe-area-inset-bottom, 0px)); background: var(--surface); border-top: 1px solid var(--line); }
.tab { display: flex; flex-direction: column; align-items: center; gap: 2px; background: none; border: 0; padding: 6px 0; color: var(--muted); font-size: 11px; font-weight: 600; }
.tab.on { color: var(--ink); }
.tab.on svg { color: var(--gold); }
.fab { justify-self: center; width: 54px; height: 54px; border-radius: 18px; border: 0; background: var(--ink); color: var(--bg); display: grid; place-items: center;
  box-shadow: 0 6px 18px rgba(0, 0, 0, 0.18); transform: translateY(-10px); }

.scrim { position: fixed; inset: 0; z-index: 20; background: var(--scrim); display: flex; align-items: flex-end; justify-content: center; }
.actions { width: 100%; max-width: 560px; background: var(--surface); border-radius: 20px 20px 0 0; padding: 10px 10px calc(16px + env(safe-area-inset-bottom, 0px)); display: grid; gap: 4px; }
.actions button, .menu button { display: grid; grid-template-columns: 28px 1fr auto; gap: 12px; align-items: center; text-align: left; padding: 12px; border: 0; background: none; border-radius: 12px; width: 100%; }
.actions button:hover, .menu button:hover { background: var(--surface-2); }
.actions span, .menu span { display: flex; flex-direction: column; }
.actions svg, .menu svg:first-child { color: var(--gold); }
.menu { list-style: none; margin: 0; padding: 0; }
.menu li + li { border-top: 1px solid var(--line); }

/* Hoja de carga (pantalla completa) */
.sheet { position: fixed; inset: 0; z-index: 30; background: var(--bg); display: flex; flex-direction: column; max-width: 560px; margin: 0 auto;
  padding-top: env(safe-area-inset-top, 0px); }
.sheet-h { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 10px 12px; border-bottom: 1px solid var(--line); background: var(--surface); }
.sheet-h h2 { font-size: 16px; font-weight: 700; }
.sheet-h > :last-child { justify-self: end; }
.sheet-h > :first-child { justify-self: start; }
.sheet-b { flex: 1; overflow-y: auto; padding: 14px 16px 28px; }
.sheet-f { border-top: 1px solid var(--line); background: var(--surface); padding: 10px 16px calc(10px + env(safe-area-inset-bottom, 0px)); }
.live { display: grid; grid-template-columns: 1fr 1fr; gap: 2px 14px; font-size: 13px; }
.live div { display: flex; justify-content: space-between; gap: 8px; }
.live span { color: var(--muted); }
.live b { font-variant-numeric: tabular-nums; }
.live .big { grid-column: 1 / -1; font-size: 15px; padding-top: 4px; border-top: 1px dashed var(--line); margin-top: 4px; }
.live .big b { color: var(--good); }
.live .big b.neg { color: var(--bad); }

.form { display: flex; flex-direction: column; gap: 14px; }
.row2, .row3 { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
.row3 { grid-template-columns: 1fr 1fr 0.7fr; }
.row2 > *, .row3 > * { min-width: 0; }
.field { display: flex; flex-direction: column; gap: 5px; min-width: 0; }
.field input:not([type="range"]), .field select, .field textarea, .picker input {
  width: 100%; padding: 10px 11px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); min-height: 42px; }
.field textarea { resize: vertical; }
.field input[type="range"] { width: 100%; accent-color: var(--gold); }
.numwrap { display: flex; align-items: center; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); min-height: 42px; }
.numwrap input { border: 0 !important; background: none !important; min-height: 40px !important; padding-inline: 8px !important; font-variant-numeric: tabular-nums; min-width: 0; }
.numwrap .affix { color: var(--muted); font-size: 13px; padding-inline: 9px 0; white-space: nowrap; }
.numwrap .affix:last-child { padding-inline: 0 10px; }
.numwrap:focus-within { outline: 2px solid var(--gold); outline-offset: 1px; }
.sect { font-size: 13px; text-transform: uppercase; letter-spacing: 0.1em; color: var(--muted); font-weight: 700; }

.seg { display: flex; background: var(--surface-2); border-radius: 11px; padding: 3px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 8px 6px; border-radius: 8px; font-size: 13.5px; font-weight: 600; color: var(--muted); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--ink); box-shadow: 0 1px 2px rgba(0, 0, 0, 0.12); }

.picker { position: relative; }
.opts { list-style: none; margin: 6px 0 0; padding: 4px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.opts button { width: 100%; display: flex; justify-content: space-between; gap: 10px; padding: 9px 10px; border: 0; background: none; border-radius: 8px; text-align: left; }
.opts button:hover { background: var(--surface-2); }
.opts .create { color: var(--gold); font-weight: 600; justify-content: flex-start; align-items: center; }
.picked { display: flex; justify-content: space-between; align-items: center; gap: 10px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); }
.picked div { display: flex; flex-direction: column; min-width: 0; }

.quote { border: 1px dashed var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
.quote-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.grid3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; }
.note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--gold-soft); font-size: 14px; }

.stockgrid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.stock h3 { font-family: var(--display); font-size: 20px; margin-bottom: 8px; }
.ing { display: flex; justify-content: space-between; align-items: baseline; padding: 6px 0; border-top: 1px solid var(--line); font-size: 13px; }
.ing b { font-variant-numeric: tabular-nums; font-size: 15px; }
.ing.silver span { color: var(--silver); }
.ing.gold span { color: var(--gold); }

.prices { display: grid; gap: 8px; }
.price { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.price span { color: var(--muted); }
.price b { font-variant-numeric: tabular-nums; font-size: 17px; }
.price.main b { font-family: var(--display); font-size: 30px; }

.pieces { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
.piece { display: grid; grid-template-columns: 56px 1fr; gap: 12px; align-items: center; padding: 10px; }
.ph { width: 56px; height: 56px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; color: var(--muted); overflow: hidden; }
.ph img { width: 100%; height: 100%; object-fit: cover; }
.pi { display: flex; flex-direction: column; min-width: 0; gap: 2px; }
.pi .w { display: flex; gap: 6px; flex-wrap: wrap; margin-top: 2px; }
.prose p, .prose ol { margin: 0 0 10px; }
.prose ol { padding-left: 20px; }

.toast { position: fixed; left: 50%; bottom: calc(96px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); opacity: 0; z-index: 40;
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 99px; font-size: 14px; font-weight: 600; transition: 0.2s; pointer-events: none; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

@media (max-width: 380px) {
  .row3 { grid-template-columns: 1fr 1fr; }
  .grid3 { grid-template-columns: 1fr; }
  .bars li { grid-template-columns: 78px 1fr auto; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
.numwrap input:focus-visible { outline: none; }

/* Pedidos personalizados */
.top-r { display: flex; align-items: center; gap: 4px; }
.iconbtn.on { color: var(--gold); }
.pagehead { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
.btn.sm { padding: 7px 12px; font-size: 14px; border-radius: 10px; }
.btn:disabled { opacity: 0.5; cursor: default; }
.st-wait { --st: var(--silver); --st-bg: var(--silver-soft); }
.st-go { --st: var(--gold); --st-bg: var(--gold-soft); }
.st-done { --st: var(--good); --st-bg: color-mix(in srgb, var(--good) 14%, var(--surface)); }
.st-lost { --st: var(--muted); --st-bg: var(--surface-2); }
.steps { display: flex; flex-wrap: wrap; gap: 6px; }
.step { border: 1px solid var(--line); background: var(--surface); border-radius: 99px; padding: 6px 11px; font-size: 13px; color: var(--muted); }
.step.on { background: var(--st-bg); color: var(--st); border-color: var(--st); font-weight: 700; }
.ghead { display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 700; margin: 4px 2px 8px; }
.ogroup { display: flex; flex-direction: column; }
.dot { width: 9px; height: 9px; border-radius: 99px; background: var(--st); }
.stchips { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; margin-bottom: 8px; }
.stchip { display: flex; flex-direction: column; padding: 8px; border-radius: 10px; background: var(--st-bg); color: var(--st); font-size: 11.5px; font-weight: 600; line-height: 1.2; }
.stchip b { font-size: 20px; font-family: var(--display); }
.orow { grid-template-columns: 44px minmax(0, 1fr) auto; }
.thumb { width: 44px; height: 44px; border-radius: 10px; background: var(--surface-2); display: grid; place-items: center; overflow: hidden; color: var(--muted); }
.thumb img { width: 100%; height: 100%; object-fit: cover; }
.photos { display: grid; grid-template-columns: repeat(auto-fill, minmax(84px, 1fr)); gap: 8px; }
.photo { position: relative; aspect-ratio: 1; max-width: 100%; border-radius: 12px; overflow: hidden; background: var(--surface-2); }
.photo .ph-open { all: unset; cursor: zoom-in; display: block; width: 100%; height: 100%; }
.photo img { width: 100%; height: 100%; object-fit: cover; display: block; }
.ph-del { position: absolute; top: 4px; right: 4px; width: 24px; height: 24px; border-radius: 99px; border: 0; background: rgba(0, 0, 0, 0.6); color: #fff; display: grid; place-items: center; }
.photo.add { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; border: 1.5px dashed var(--line); background: var(--surface); color: var(--muted); font-size: 12px; cursor: pointer; }
.photo.add input { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.block { display: flex; flex-direction: column; gap: 10px; border: 1px solid var(--line); border-radius: 12px; padding: 12px; background: var(--surface); }
.block-h { display: flex; justify-content: space-between; align-items: center; gap: 8px; flex-wrap: wrap; }
.block-h .seg { min-width: 120px; }
.qcard { display: grid; gap: 4px; }
.qrow { display: flex; justify-content: space-between; font-variant-numeric: tabular-nums; }
.qrow:first-child b { font-family: var(--display); font-size: 22px; }
.copytext { width: 100%; font-size: 13px; padding: 10px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); }
.older summary { cursor: pointer; font-size: 13px; color: var(--muted); }
.older ul { margin: 6px 0 0; padding-left: 18px; font-size: 13px; }
.zoom { position: fixed; inset: 0; z-index: 50; background: rgba(0, 0, 0, 0.85); display: grid; place-items: center; padding: 16px; cursor: zoom-out; }
.zoom img { max-width: 100%; max-height: 100%; border-radius: 8px; }
.price span small { display: block; font-size: 12px; }
.check { display: flex; align-items: center; gap: 8px; font-size: 13px; color: var(--muted); }
.check input { accent-color: var(--gold); width: 16px; height: 16px; }
.qb { display: flex; flex-direction: column; gap: 14px; }
@media (max-width: 380px) { .stchips { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.st-ready { --st: var(--good); --st-bg: color-mix(in srgb, var(--good) 12%, var(--surface)); }
.flow { display: flex; flex-direction: column; gap: 8px; }
.track { list-style: none; margin: 0; padding: 0; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 4px; }
.track li { display: flex; flex-direction: column; gap: 5px; font-size: 10.5px; line-height: 1.15; color: var(--muted); }
.track li::before { content: ''; height: 4px; border-radius: 99px; background: var(--line); }
.track li.done::before { background: var(--silver); }
.track li.now::before { background: var(--gold); }
.track li.now { color: var(--ink); font-weight: 700; }
.flow-note { margin: 0; padding: 10px 12px; border-radius: 10px; background: var(--st-bg); font-size: 13.5px; }
.flow-note b { color: var(--st); }
.qcard.confirmed { border-left: 3px solid var(--gold); padding-left: 10px; }
.badge { align-self: flex-start; font-size: 11px; font-weight: 700; color: var(--gold); text-transform: uppercase; letter-spacing: 0.08em; }
.qimgs { display: flex; gap: 6px; margin-bottom: 4px; }
.qimgs img { width: 56px; height: 56px; object-fit: cover; border-radius: 8px; }
.tag.ok { background: color-mix(in srgb, var(--good) 14%, var(--surface)); color: var(--good); }
.hint.bad { color: var(--bad); }
.login { min-height: 100%; display: flex; flex-direction: column; justify-content: center; gap: 20px; max-width: 420px; margin: 0 auto; padding: 40px 16px; }
.brand.big { justify-content: center; }
.brand.big .mark { font-size: 44px; }
.brand.big .word { font-size: 36px; }
.field.grow { flex: 1; }
.toolbar .btn { align-self: flex-end; }
.weborders { list-style: none; margin: 0; padding: 0; display: grid; gap: 10px; }
.wo.done { opacity: 0.72; }
.wo-h { display: flex; justify-content: space-between; gap: 10px; }
.wo-h span { display: flex; flex-direction: column; min-width: 0; }
.wo-lines { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 6px; font-size: 14px; }
.wo-lines li { display: flex; justify-content: space-between; align-items: center; gap: 10px; }
.wo-lines li > span { min-width: 0; }
.warn { color: var(--bad); }
</style>
